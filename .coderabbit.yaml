# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: 'You are an expert code reviewer in TypeScript, JavaScript, React, and Next.js. Provide concise, clear review advice. Only elaborate when requested.'
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_instructions:
    - path: "{app,nexus-app/app}/**/*.{ts,tsx}"
      instructions: |
        Review Next.js App Router code. Ensure:
        - Server vs client components are used correctly ("use client" only where needed)
        - No secrets or API keys exposed to the client
        - API routes validate input and handle errors
        - Proper loading and error states
    - path: "{prisma,nexus-app/prisma}/**/*"
      instructions: |
        Review Prisma schema and migrations for data integrity, indexes, and safe migrations.
chat:
  auto_reply: true
